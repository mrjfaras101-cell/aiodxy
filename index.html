ق بين Community و Enterprise… وأيّهما أحتاج؟`,a:`النسخة المجتمعية (Community) مجانية ومفتوحة المصدر وتُستضاف على سيرفراتك، وتغطي التطبيقات الأساسية. أما Enterprise فهي اشتراك مدفوع لكل مستخدم يمنحك جميع التطبيقات مع Odoo Studio وتعدد الشركات وواجهات API الخارجية والدعم الرسمي والترقيات. في جلسة التحليل نحدّد النسخة الأنسب بحسب عدد الفروع وحجم التخصيص وميزانيتك، ويمكن الانتقال بين النسختين لاحقًا.`},{q:`كم تستغرق مدة تنفيذ أودو؟`,a:`المشاريع الصغيرة (3–5 تطبيقات) تنطلق عادةً خلال 4–6 أسابيع، والمتوسطة (6–10 تطبيقات مع تخصيصات) خلال 8–14 أسبوعًا، والمشاريع متعددة الشركات والفروع قد تمتد إلى 12–20 أسبوعًا. نعمل بمنهجية تسليم مرحلي حتى تبدأ بالاستفادة من أجزاء النظام قبل اكتمال كل شيء.`},{q:`هل يمكن نقل بياناتنا الحالية إلى أودو؟`,a:`نعم، الترحيل جزء أساسي من مشاريعنا. نستورد العملاء والموردين والأصناف والفواتير والأرصدة الافتتاحية من أنظمتك الحالية أو من ملفات Excel، مع تنقية البيانات ومنع التكرار ومطابقة أرصدة المخزون والحسابات قبل الانطلاق، ونوثّق خطوات الترحيل لضمان قابلية التكرار.`},{q:`هل النظام يدعم العربية بالكامل؟`,a:`نعم، واجهة أودو تدعم العربية بالكامل بتخطيط من اليمين إلى اليسار، ويمكن إصدار الفواتير والتقارير والمستندات بالعربية أو الإنجليزية أو الاثنين معًا، كما نُدرّب الفريق بالعربية ونُسلّم الأدلة بلغتين.`},{q:`هل يمكن تخصيص النظام لعملياتنا الخاصة؟`,a:`هذا جوهر عملنا. نبدأ بما يوفّره أودو جاهزًا، ثم نستخدم Odoo Studio للحالات البسيطة، ونبني وحدات مخصّصة بلغة Python وأطر أودو الحديثة للحالات المعقّدة، مع الالتزام بمعايير تطوير نظيفة تحفظ سهولة الترقية مستقبلًا.`},{q:`ما خيارات الاستضافة المتاحة؟`,a:`ثلاثة خيارات: Odoo Online (الأبسط والأسرع، بلا إدارة سيرفرات)، Odoo.sh (للبيئات التي تحتاج تطويرًا مخصّصًا مع نسخ وبيئات متعددة)، أو استضافة على سيرفراتك الخاصة أو سحابة تختارها. نُساعدك في تحديد الخيار الأنسب من ناحية التكلفة والخصوصية والامتثال.`},{q:`ماذا يحدث بعد الإطلاق؟`,a:`لدينا مسار دعم واضح: دعم مكثّف في الأسابيع الأولى، ثم عقد دعم وصيانة باتفاقية مستوى خدمة تحدّد قنوات التواصل وأوقات الاستجابة، مع مراجعة دورية للأداء وبند تطويرات شهري مرن بحسب أولوياتك.`},{q:`هل تعملون مع عملاء خارج السعودية؟`,a:`نعم، نخدم عملاء في الإمارات وقطر والكويت وعُمان والبحرين والأردن والمنطقة، ونتواصل عن بُعد بجلسات مرتّبة، مع إمكانية زيارات ميدانية عند الحاجة لحجم المشروع.`}],more:`لم تجد إجابتك؟ اسأل مستشارنا مباشرة.`},contact:{eyebrow:`لنبدأ`,title:`أخبرنا عن أعمالك… وسنقترح خطة أودو المناسبة`,subtitle:`املأ النموذج وسيتواصل معك مستشار خلال يوم عمل واحد، أو تواصل مباشرة عبر القنوات التالية.`,form:{name:`الاسم الكامل`,namePlaceholder:`مثال: أحمد العامري`,company:`اسم الشركة`,companyPlaceholder:`مثال: شركة النخبة للتجارة`,email:`البريد الإلكتروني`,emailPlaceholder:`name@company.com`,phone:`رقم الجوال`,phonePlaceholder:`+966 5X XXX XXXX`,country:`الدولة`,size:`عدد المستخدمين المتوقع`,sizeOptions:[`1–5`,`6–20`,`21–50`,`51–150`,`أكثر من 150`],interests:`التطبيقات التي تهمّك`,interestOptions:[`المحاسبة`,`المبيعات وCRM`,`المخزون`,`التصنيع`,`المشتريات`,`الموارد البشرية`,`المشاريع`,`نقاط البيع`,`الموقع والتجارة الإلكترونية`],message:`تفاصيل إضافية عن التحديات الحالية`,messagePlaceholder:`مثال: نعمل على ثلاثة أنظمة منفصلة والمخزون غير دقيق…`,submit:`أرسل الطلب واحصل على استشارة`,sending:`جارٍ الإرسال…`,success:`شكرًا لك! تم تجهيز طلبك، ويسعدنا مراجعة تفاصيلك وإرساله عبر بريدنا.`,successHint:`إن لم يُفتح برنامج البريد تلقائيًا، راسلنا على`,required:`هذا الحقل مطلوب`,emailError:`صيغة البريد الإلكتروني غير صحيحة`,selectPlaceholder:`اختر…`,privacy:`بياناتك تُستخدم للتواصل بخصوص طلبك فقط، ولا تُشارك مع أي جهة أخرى.`,openMail:`إرسال بالبريد الإلكتروني`,orWhatsapp:`أو تحدّث معنا على واتساب`},info:{title:`قنوات التواصل`,phone:`الهاتف`,whatsapp:`واتساب`,email:`البريد الإلكتروني`,sales:`المبيعات والشراكات`,address:`المكتب الرئيسي`,hours:`ساعات العمل`,responseTime:`متوسط زمن الرد: أقل من 4 ساعات عمل`},cardTitle:`استشارة أولى مجانية`,cardPoints:[`جلسة 30 دقيقة مع مستشار أودو`,`قراءة سريعة لوضعك الحالي والتحديات`,`توصية بالنسخة والتطبيقات المناسبة`,`تقدير مبدئي للمدة والتكلفة`]},footer:{about:`شريك أودو رسمي متخصّص في تحليل وتنفيذ وتخصيص أنظمة Odoo ERP just now`,kpis:[{label:`Monthly revenue`,value:`SAR 412K`,trend:`+12.4%`},{label:`Sales orders this week`,value:`184`,trend:`+8.1%`},{label:`Items below reorder point`,value:`7 SKUs`,trend:`−3`},{label:`Pending invoices`,value:`SAR 96K`,trend:`−18%`}],pipeline:`Sales pipeline`,stages:[{label:`Leads`,value:62},{label:`Quotations`,value:38},{label:`Negotiation`,value:19},{label:`Won`,value:11}],flow:[`Quotation`,`Sales order`,`Invoice`,`Journal entry`],liveChip:`Apps talking to each other, live`}},trust:{title:`Odoo apps we implement every single day`,facts:[{value:`US$ 24.90`,label:`Odoo pricing starts per user / month`},{value:`LGPL v3`,label:`license of the free Community edition`},{value:`100K+`,label:`developers contributing to Odoo worldwide`},{value:`RTL`,label:`fully native right-to-left Arabic UI`}],note:`Figures and pricing are referenced from Odoo's official website (odoo.com) and may vary by country and billing period.`},values:{eyebrow:`Why Odoo`,title:`One platform that replaces a stack of disconnected tools`,subtitle:`Odoo isn't one more tool to add to your list — it's the single system that ties everything together. Each app works on its own, and together they become one connected ERP.`,items:[{icon:`layers`,title:`One platform, zero silos`,text:`A quotation becomes a sales order, then an invoice — while stock and accounting entries update themselves. No exports, no double entry.`},{icon:`wallet`,title:`Clear pricing, no surprises`,text:`A single per-user subscription unlocks every app, with a lower-cost light user option — no usage-based billing and no hidden add-ons.`},{icon:`code`,title:`Open source means real ownership`,text:`Your data sits in PostgreSQL, and you can read, extend and move the system wherever you want. No vendor lock-in, no closed file formats.`},{icon:`globe`,title:`Arabic-first and compliance-ready`,text:`Full right-to-left interface and Arabic reports, multi-currency and multi-tax support, and readiness for local e-invoicing requirements.`},{icon:`sparkles`,title:`Room to grow without limits`,text:`From a small custom field in Studio to a full module built in Python on modern Odoo frameworks — the system grows with you instead of holding you back.`},{icon:`cloud`,title:`Deployment that fits your policy`,text:`Odoo Online for managed cloud, Odoo.sh for heavy customization, or your own servers — we help you pick what balances cost, privacy and control.`}]},apps:{eyebrow:`Odoo apps`,title:`Every department in your company has an app ready`,subtitle:`We configure and connect 36+ official apps to cover your entire operation. Pick the area that matters to you and see what we usually deliver.`,allLabel:`All apps`,footnote:`The app list is based on the official Odoo “All apps” page at odoo.com. We also implement community modules and fully custom apps when needed.`,highlightLabel:`Where we usually start`},platform:{eyebrow:`Inside the system`,title:`What Odoo actually looks like once we configure it`,subtitle:`Rather than talking in theory, here is a practical look at four core business cycles we build for most of our clients.`,blocks:[{tag:`Sales & CRM`,title:`A sales cycle that never drops a lead`,text:`We shape the pipeline around your real stages, then add predictive lead scoring and automatic assignment across the team.`,bullets:[`Visual kanban pipeline with predictive lead scoring`,`Online quotations with digital signature and payment`,`One click from quotation to sales order to invoice`]},{tag:`Accounting & finance`,title:`Close the month in days, not weeks`,text:`We set up your chart of accounts, taxes and currencies, and connect your banks so bookkeeping becomes mostly automatic.`,bullets:[`Smart bank reconciliation and automatic matching`,`OCR vendor bill capture that cuts manual entry`,`Instant financial and analytic reports in Arabic and English`]},{tag:`Inventory & manufacturing`,title:`No surprise stock-outs, no cash frozen on shelves`,text:`We design your warehouses, locations and routes, then tune reordering rules against your real demand data.`,bullets:[`Barcode, serial and lot tracking end to end`,`Multi-level bills of materials with accurate product costing`,`Demand planning, reordering rules and vendor replenishment`]},{tag:`People & projects`,title:`Every hour is recorded and every project is priced right`,text:`Your team logs time against tasks, while dashboards show project cost and workload in real time.`,bullets:[`Resource planning, task assignment and deadlines`,`Timesheets and costs flowing straight into invoices`,`Helpdesk tickets, contracts and a shared knowledge base`]}]},services:{eyebrow:`Services`,title:`From the first analysis session to life after go-live`,subtitle:`We don't just sell licenses. We run the full delivery cycle with a team that blends process knowledge and deep Odoo engineering.`,items:[{icon:`search`,title:`Process analysis & readiness`,text:`Workshops with your departments map today's processes, expose the gaps and produce a realistic, agreed scope document.`,points:[`Fit-gap assessment`,`Signed scope document`,`Phased delivery plan`]},{icon:`settings`,title:`Odoo implementation & setup`,text:`We install the right edition (Community or Enterprise) and configure companies, branches, users, access rights, chart of accounts and taxes.`,points:[`Odoo Online, Odoo.sh or on-premise`,`Roles & access rights`,`Local tax and invoicing setup`]},{icon:`code`,title:`Customization & module development`,text:`Whatever Odoo doesn't do out of the box: custom fields, reports and dashboards, or full modules in Python on modern Odoo frameworks — built upgrade-safe.`,points:[`Clean, upgrade-safe custom modules`,`Bespoke reports & dashboards`,`Odoo Studio when it's enough`]},{icon:`plug`,title:`Integrations with your ecosystem`,text:`We connect Odoo to payment gateways, online stores, banks, shipping platforms, HR tools and government/e-invoicing services through APIs.`,points:[`XML-RPC, JSON-RPC and REST`,`eCommerce, carriers & gateways`,`E-invoicing and banking`]},{icon:`database`,title:`Data migration & cleansing`,text:`We move customers, products, balances and invoices from legacy systems or spreadsheets, then de-duplicate and reconcile before go-live.`,points:[`De-duplication & cleansing`,`Stock and account reconciliation`,`Documented, repeatable migration`]},{icon:`graduation`,title:`Training & team enablement`,text:`Hands-on role-based training (sales, warehouse, accounting, management) with bilingual manuals and a sandbox to practise safely.`,points:[`Sessions per role`,`AR/EN user guides`,`Internal training certificates`]},{icon:`lifebuoy`,title:`Post-go-live support & maintenance`,text:`Support contracts with a clear SLA: defined response times, regular health checks and a flexible monthly customisation allowance.`,points:[`SLA-backed response times`,`Monthly performance reviews`,`Flexible change requests`]},{icon:`server`,title:`Hosting & infrastructure`,text:`We prepare production environments, backups, monitoring and security policies — on Odoo's cloud or on your own infrastructure.`,points:[`Scheduled backups`,`Monitoring & regular updates`,`Staging that mirrors production`]}]},process:{eyebrow:`Methodology`,title:`Six clear stages — each one ends with a deliverable you keep`,subtitle:`We run a structured project method that protects your time and shows progress weekly, instead of an open-ended project.`,steps:[{title:`Discovery & analysis`,text:`Workshops with each department to capture current processes, pain points and the success measures you expect from the system.`,duration:`1–2 weeks`},{title:`Solution design`,text:`We map the target processes in Odoo and define the apps, customizations and integrations required, then lock an agreed scope.`,duration:`1–2 weeks`},{title:`Configuration & build`,text:`System installation, configuration, custom modules and integrations — delivered incrementally, module by module.`,duration:`3–6 weeks`},{title:`Data migration & testing`,text: asing and vendor bills.`,modules:[`Inventory`,`Purchase`,`Accounting`]},{name:`Education & training`,text:`Course subscriptions and invoicing, attendance tracking and clean financial reporting.`,modules:[`Subscriptions`,`Events`,`Accounting`]}]},whyUs:{eyebrow:`Why us`,title:`A team that delivers — not a team that only sells`,subtitle:`What separates a successful rollout from a stalled one is people and method, not the software name. These are the commitments we make to you.`,items:[{icon:`badge`,title:`Odoo-certified specialists`,text:`Consultants and developers with hands-on Odoo delivery experience — not a middle layer that forwards your project elsewhere.`},{icon:`chat`,title:`Truly bilingual support`,text:`Communication, training and documentation in Arabic and English, with a firm grasp of Gulf and Middle East business context.`},{icon:`shield`,title:`Scope and price in writing`,text:`An approved scope before kickoff and clear packages — no hidden lines and no surprise invoices mid-project.`},{icon:`gauge`,title:`Visible, staged delivery`,text:`A weekly progress board and a review session with you at the end of every stage before the next one begins.`},{icon:`clock`,title:`Time-bound response`,text:`A clear post-launch SLA: defined channels, written response times and priority handling for critical issues.`},{icon:`brain`,title:`Decisions driven by your data`,text:`We measure before we recommend — reviewing your current data to propose what genuinely saves time, not a longer app list.`}],stats:[{value:`60`,suffix:`+`,label:`rollouts and data migrations delivered`},{value:`97`,suffix:`%`,label:`client satisfaction with delivery & support`},{value:`4`,suffix:` hrs`,label:`average first response time on tickets`},{value:`12`,suffix:`+`,label:`industries served across the region`}]},editions:{eyebrow:`Editions`,title:`Community or Enterprise? The answer is in your processes`,subtitle:`Both editions share the same codebase and you can switch at any time. Here is a API`,`Odoo.sh or on-premise hosting`],badge:`Best for customization`}],odooNote:`Prices are referenced from Odoo's pricing page at odoo.com and vary by country, billing cycle and user count. A light user license is available at US$ 8.90 per month. Always check odoo.com/pricing for current figures.`,packagesTitle:`Our implementation packages`,packagesSubtitle:`Indicative pricing — the final figure is fixed after the analysis and scoping session.`,packages:[{name:`Launch`,tagline:`For small teams that want results fast`,price:`From US$ 4,900`,duration:`4–6 weeks`,bestFor:`Up to 10 users · 3–5 apps`,features:[`Analysis session and scope document`,`Setup of 3–5 core apps`,`Essential data migration (customers, products)`,`Key-user training and a user guide`,`30 days of post-launch support`],cta:`Request a quote`,featured:!1},{name:`Professional`,tagline:`Our most requested package for growing companies`,price:`From US$ 12,900`,duration:`8–14 weeks`,bestFor:`Up to 25 users · 6–10 apps`,features:[`Detailed analysis and process mapping`,`App setup with cross-app workflows`,`Customizations and reports (up to 80 dev hours)`,`Full data migration with balance reconciliation`,`Two integrations with external systems`,`Role-based training + 90 days of support`],cta:`Request a quote`,featured:!0},{name:`Enterprise`,tagline:`For multi-branch and complex operations`,price:`From US$ 24,900`,duration:`12–20 weeks`,bestFor:`Unlimited users · multi-company & branches`,features:[`Solution architecture and advanced design`,`Multi-company, branches and warehouses`,`Custom modules and multiple integrations`,`Advanced manufacturing, quality and costing`,`Historical migration from several systems`,`Annual support contract with SLA`],cta:`Talk to a consultant`,featured:!1}],packagesNote:`Prices are in USD and exclude Odoo license fees (paid directly to Odoo) and server costs. Annual support and maintenance plans are available in several tiers.`,includesTitle:`Included in every package`,includes:[`A dedicated project manager and clear communication channels`,`Arabic and English documentation of what was delivered`,`A staging environment that mirrors production`,`Weekly check-ins and written progress reports`,`Post-go-live support with defined service levels`]},testimonials:{eyebrow:`Client stories`,title:`Outcomes our clients talk about`,subtitle:`Sample results from projects our team delivered across different sectors.`,items:[{quote:`We now close our month in four days instead of two weeks, and more importantly the finance team stopped juggling separate spreadsheets.`,name:`Finance Director`,role:`Food distribution company — Riyadh`},{quote:`Stock finally became one shared source of truth for sales and the warehouse, and stock-outs dropped noticeably within the first three months.`,name:`Operations Manager`,role:`Industrial detergents manufacturer — Dammam`},{quote:`What impressed us most was the training: every department walked out of the sessions able to do its job without asking us at every step.`,name:`Chief Executive Officer`,role:`Multi-branch retail group — Dubai`}]},faq:{eyebrow:`FAQ`,title:`What clients ask us before kickoff`,subtitle:`If your question isn't here, send it over and we'll answer straight — no sales talk.`,items:[{q:`What's the difference between Community and Enterprise, and which do I need?`,a:`Community is free and open source, self-hosted, and covers the core apps. Enterprise is a paid per-user subscription that unlocks all apps along with Odoo Studio, multi-company support, external APIs, official support and upgrades. During the analysis we recommend the right edition based on your branches, how much customization you need and your budget — and you can move between editions later.`},{q:`How long does an Odoo implementation take?`,a:`Small projects (3–5 apps) typically go live in 4–6 weeks, mid-size ones (6–10 apps with customization) in 8–14 weeks, and multi-company or multi-branch rollouts can run 12–20 weeks. We deliver in phases so you start benefiting from part of the system before everything is finished.`},{q:`Can you migrate our existing data into Odoo?`,a:`Yes — migration is a core part of our projects. We import customers, vendors, products, invoices and opening balances from your current systems or spreadsheets, de-duplicate and clean the data, and reconcile stock and account balances before go-live. Every migration step is documented so it can be repeated.`},{q:`Does the system fully support Arabic?`,a:`Yes. Odoo's interface is fully right-to-left Arabic, and invoices, reports and documents can be issued in Arabic, English or both. We also train your team in Arabic and hand over user guides in both languages.`},{q:`Can the system be customized for our own processes?`,a:`That's exactly what we do. We start with what Odoo offers out of the box, use Odoo Studio for simple tweaks, and build clean custom modules in Python on modern Odoo frameworks for complex cases — always keeping future upgrades in mind.`},{q:`What hosting options are available?`,a:`Three options: Odoo Online (simplest, no server management), Odoo.sh (for custom development with staging and multiple branches), or hosting on your own servers or a cloud you choose. We help you pick based on cost, privacy and compliance.`},{q:`What happens after go-live?`,a:`We follow a clear support path: intensive support in the first weeks, then a support and maintenance contract with an SLA defining channels and response times, regular performance reviews and a flexible monthly development allowance.`},{q:`Do you work with clients outside Saudi Arabia?`,a:`Yes. We serve clients across the UAE, Qatar, Kuwait, Oman, Bahrain, Jordan and the wider region, working remotely in structured sessions, with on-site visits when the project size calls for it.`}],more:`Still have a question? Ask our consultant directly.`},contact:{eyebrow:`Let's talk`,title:`Tell us about your business — we'll propose the right Odoo plan`,subtitle:`Fill in t
